[package]
name = "marsh-rest"
description = "A REST and WebSocket frontend over one marsh transaction mux"
version = "0.1.0"
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
bench = false

[[bin]]
name = "marsh-rest"
path = "src/main.rs"
bench = false

[dependencies]
shellmux = { path = "../shellmux" }
# Only for the `ShellEnvironment` every `ShellMux::new` takes; this process runs no shell of its own.
brush-core = { version = "^0.5.0", path = "../brush-core" }
# `ws` for the one event/input socket; the default features carry the JSON extractor and the
# tokio-backed server this crate's `axum::serve` uses.
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A job's terminal chunk is bytes, not text: it may split a UTF-8 sequence, so it travels base64.
base64 = "0.22"
clap = { version = "4.6.0", features = ["derive"] }
thiserror = "2"
# `net` for the listener, `signal` for the Ctrl-C that ends the server, `sync` for the broadcast
# channel the frontend publishes events on, `macros` for the `select!` each socket's loop is.
tokio = { version = "1.52.3", features = [
    "rt",
    "rt-multi-thread",
    "sync",
    "signal",
    "net",
    "macros",
] }
