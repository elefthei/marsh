name: "CI"
on:
  pull_request:
    paths-ignore:
      - "release-plz.toml"
  push:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - "release-plz.toml"
    branches:
      - main

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CLICOLOR: 1
  CLICOLOR_FORCE: 1

permissions:
  actions: read
  contents: read

# Only allow one run of the workflow per branch / PR at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# MARSH: reconciled with the port. xtask, brush-shell, and the YAML test harness are gone,
# so every job invokes cargo directly (commands taken from upstream xtask/src/check.rs).
# marsh is Linux-only — shellmux links libbtrfsutil, snapshots btrfs subvolumes, and traces
# with strace — so the windows/macos/wasm/android/BSD matrix entries are gone too.

jobs:
  # Build and upload binaries for the supported (Linux) architectures.
  # marsh needs marsh-exec beside it at runtime, so both are built and shipped.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: "ubuntu-24.04"
            arch: "x86_64"
          - host: "ubuntu-24.04-arm"
            arch: "aarch64"

    name: "Build (${{ matrix.arch }}/linux)"
    runs-on: ${{ matrix.host }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Enable cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install build prerequisites
        run: sudo apt-get update -y && sudo apt-get install -y libbtrfsutil-dev libclang-dev

      - name: Build
        run: cargo build --release -p marsh-shell -p shellmux

      - name: "Upload binaries"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.arch }}-linux
          path: |
            target/release/marsh
            target/release/marsh-exec

  # Test functional correctness.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: "ubuntu-24.04"
            variant: "linux-x86_64"
            artifact_suffix: "linux-x86_64"
            name_suffix: "(linux/x86_64)"

          - host: "ubuntu-24.04-arm"
            variant: "linux-aarch64"
            artifact_suffix: "linux-aarch64"
            name_suffix: "(linux/aarch64)"

    name: "Test ${{ matrix.name_suffix }}"
    runs-on: ${{ matrix.host }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Enable cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-nextest

      - name: Install test prerequisites
        run: sudo apt-get update -y && sudo apt-get install -y libbtrfsutil-dev libclang-dev btrfs-progs strace

      # The shellmux tests snapshot and diff btrfs subvolumes under CARGO_TARGET_TMPDIR
      # (<workspace>/target/tmp). Runners are ext4, so mount a loopback btrfs image there.
      # user_subvol_rm_allowed lets the unprivileged test process delete its own subvolumes.
      - name: Mount btrfs at target/tmp
        run: |
          truncate -s 4G /tmp/btrfs.img
          mkfs.btrfs -q /tmp/btrfs.img
          mkdir -p target/tmp
          sudo mount -o loop,user_subvol_rm_allowed /tmp/btrfs.img target/tmp
          sudo chown "$(id -u):$(id -g)" target/tmp

      - name: Test
        run: cargo nextest run --workspace

      - name: Doc tests
        run: cargo test --workspace --doc

      - name: Collect test results
        if: always()
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          if [[ -f target/nextest/default/test-results.xml ]]; then
            mv target/nextest/default/test-results.xml "test-results-${VARIANT}.xml"
          fi

      - name: "Upload test results"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-reports${{ matrix.artifact_suffix }}
          path: test-results-*.xml

  # Static analysis of the code.
  check:
    name: "Source code checks"
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        # Test latest stable as well as MSRV. MARSH: the port's MSRV is 1.94.0 (rust-validator),
        # not upstream's 1.88.0.
        rust-version: ["stable", "1.94.0"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up rust toolchain (${{ matrix.rust-version }})
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ matrix.rust-version }}
          components: clippy, rustfmt

      - name: Enable cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Needed to make sure cargo-deny is correctly cached.
          cache-all-crates: true

      - name: Install build prerequisites
        run: sudo apt-get update -y && sudo apt-get install -y libbtrfsutil-dev libclang-dev

      # Format output can drift between rustfmt releases (that is how the repo's
      # pre-existing drift arose), so the check is pinned to one toolchain: stable.
      - name: Format check
        if: matrix.rust-version == 'stable'
        run: cargo fmt --check --all

      - name: Check
        run: cargo check --workspace --all-targets --all-features

      - name: Install cargo-deny
        if: matrix.rust-version == 'stable'
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-deny

      - name: Deny check
        if: matrix.rust-version == 'stable'
        run: cargo deny --all-features check all

      - name: Clippy check
        if: matrix.rust-version == 'stable'
        run: cargo clippy --workspace --all-features --all-targets

  # Check for unneeded dependencies.
  check-deps:
    name: "Check for unneeded dependencies"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up nightly rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly

      - name: Install cargo-udeps
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-udeps

      - name: Install build prerequisites
        run: sudo apt-get update -y && sudo apt-get install -y libbtrfsutil-dev libclang-dev

      - name: Check for unused dependencies
        run: cargo udeps --workspace --all-targets --all-features

  # Performance analysis of the code.
  benchmark:
    if: github.event_name == 'pull_request'
    name: "Benchmarks"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: pr

      - name: Checkout main sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: main
          ref: main

      - name: Set up rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Enable cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            ./pr
            ./main

      - name: Install build prerequisites
        run: sudo apt-get update -y && sudo apt-get install -y libbtrfsutil-dev libclang-dev

      - name: Performance analysis on PR
        run: cargo bench --workspace --benches -- --output-format bencher | tee benchmarks.txt
        working-directory: pr

      - name: Performance analysis on main
        run: cargo bench --workspace --benches -- --output-format bencher | tee benchmarks.txt
        working-directory: main

      - name: Compare benchmark results
        run: |
          ./pr/scripts/compare-benchmark-results.py -b main/benchmarks.txt -t pr/benchmarks.txt >benchmark-results.md

      - name: Upload performance results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-reports
          path: |
            pr/benchmarks.txt
            main/benchmarks.txt
            benchmark-results.md
