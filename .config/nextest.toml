[profile.default]
retries = 3
status-level = "slow"
slow-timeout = { period = "5s", terminate-after = 3, grace-period = "2s" }
fail-fast = false

[profile.default.junit]
path = "test-results.xml"

# MARSH: the frontend fuzz target runs the whole reference corpus — 48 traces, each in a fresh
# btrfs fixture, twice — so it needs an explicit bounded allowance rather than a coverage cut to
# fit the package-wide limit below. Retries are off: the global three would hide a race that was
# actually found, and a retried random trace draws a new wall-clock seed. Nextest uses the first
# matching override per setting, so this must stay above the package-wide one.
[[profile.default.overrides]]
filter = 'package(=shellmux) & binary(=mux_frontend_fuzz)'
retries = 0
slow-timeout = { period = "30s", terminate-after = 30, grace-period = "2s" }

# MARSH: the shellmux transaction tests run whole traced pipelines (the mux_seq suite is
# ~30s wall); the default 3x5s slow-timeout would terminate them.
[[profile.default.overrides]]
filter = "package(shellmux)"
slow-timeout = { period = "30s", terminate-after = 4, grace-period = "2s" }
