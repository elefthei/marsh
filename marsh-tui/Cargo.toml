[package]
name = "marsh-tui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
bench = false

[dependencies]
shellmux = { path = "../shellmux" }
brush-core = { path = "../brush-core" }
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
tui-term = { version = "0.3.4", default-features = false, features = ["vt100"] }
vt100 = "0.16.2"
ratatui-textarea = { version = "0.9.2", default-features = false, features = [
    "crossterm",
] }
tui-tree-widget = "0.24.1"
tokio = { version = "1.52.3", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "signal",
    "time",
] }
futures-util = { version = "0.3", default-features = false }
smallvec = "1.15"
thiserror = "2"
