[package]
name = "marsh-exec"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
brush-core.workspace = true
brush-builtins.workspace = true
# The `git` builtin this executor's worker shell is built from.
brush-builtin.workspace = true
# The builtin hook wrapper and the record vocabulary the worker shell reports through.
brush-instrumentation.workspace = true
# The btrfs seed, its state directory and the snapshots a command runs in.
brush-btrfs.workspace = true
tokio = { version = "1", features = ["rt", "macros"] }
thiserror = "2"
libc = "0.2"

[dev-dependencies]
# Ordinary directories for the executor's own fixtures: nothing here needs a btrfs subvolume.
tempfile = "3.27.0"
# The end-to-end tests inspect the repository the `git` builtin wrote. Same flags as
# brush-builtin uses, so the vendored library is built once.
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }

[lib]
name = "marsh_exec"
bench = false

[[bin]]
name = "marsh-exec"
path = "src/main.rs"
bench = false
