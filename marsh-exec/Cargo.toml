[package]
name = "marsh-exec"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
brush-core = { path = "../brush-core" }
brush-builtins = { path = "../brush-builtins" }
# `default-features = false` drops the ssh/https transports (and openssl with them); nothing here
# talks to a remote. `vendored-libgit2` builds the bundled library, so no system libgit2 is needed.
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
btrfsutil = "=0.2.0"
# `/proc/mounts` parsing: the mount that governs a path decides whether snapshots can be taken
# there and reclaimed unprivileged.
proc-mounts = "0.3"

[dev-dependencies]
# Ordinary directories for the executor's own fixtures: nothing here needs a btrfs subvolume.
tempfile = "3.27.0"

[lib]
name = "marsh_exec"
bench = false

[[bin]]
name = "marsh-exec"
path = "src/main.rs"
bench = false
